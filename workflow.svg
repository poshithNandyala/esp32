<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- CSS for animations -->
    <style>
      .laptop { fill: #2d3436; }
      .screen { fill: #000000; }
      .esp32 { fill: #0984e3; }
      .text-light { fill: #dfe6e9; font-family: monospace; font-size: 14px; }
      .text-title { fill: #ffffff; font-family: sans-serif; font-weight: bold; font-size: 18px; }
      
      /* Wi-Fi waves animation */
      .wifi { opacity: 0; animation: pulse 2s infinite; stroke: #00b894; stroke-width: 3; fill: none; }
      .w1 { animation-delay: 0s; }
      .w2 { animation-delay: 0.3s; }
      .w3 { animation-delay: 0.6s; }

      /* Bluetooth waves animation */
      .bt { opacity: 0; animation: pulse 2s infinite; stroke: #0984e3; stroke-width: 3; fill: none; }
      .b1 { animation-delay: 1s; }
      .b2 { animation-delay: 1.3s; }
      .b3 { animation-delay: 1.6s; }

      @keyframes pulse {
        0% { opacity: 0; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.2); }
      }

      /* Code typing animation */
      .type1 { opacity: 0; animation: typeAnim 6s infinite; }
      .type2 { opacity: 0; animation: typeAnim 6s infinite; animation-delay: 1s; }
      .type3 { opacity: 0; animation: typeAnim 6s infinite; animation-delay: 2s; }
      .type4 { opacity: 0; animation: typeAnim 6s infinite; animation-delay: 3s; }

      @keyframes typeAnim {
        0%, 10% { opacity: 0; }
        15%, 100% { opacity: 1; }
      }
      
      /* ESP32 LED Blink */
      .led { fill: #d63031; animation: blink 1s infinite; }
      @keyframes blink { 0%, 100% { fill: #d63031; } 50% { fill: #ff7675; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#1e272e" rx="10"/>

  <!-- Control Laptop -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="140" height="90" rx="5" class="laptop"/>
    <rect x="5" y="5" width="130" height="80" class="screen"/>
    <rect x="-10" y="90" width="160" height="10" rx="3" fill="#636e72"/>
    <text x="70" y="-15" text-anchor="middle" class="text-title">Control Laptop</text>
    <text x="70" y="30" text-anchor="middle" class="text-light" fill="#00b894">Web UI (Wi-Fi)</text>
    <text x="70" y="55" text-anchor="middle" class="text-light" fill="#ffeaa7">&gt; Send Payload</text>
  </g>

  <!-- Wi-Fi Signals (from Control to ESP32) -->
  <g transform="translate(230, 195)">
    <path d="M 0,0 Q 15,-15 30,0" class="wifi w1"/>
    <path d="M -10,-10 Q 15,-35 40,-10" class="wifi w2"/>
    <path d="M -20,-20 Q 15,-55 50,-20" class="wifi w3"/>
    <text x="15" y="-60" text-anchor="middle" class="text-light" fill="#00b894">Wi-Fi</text>
  </g>

  <!-- ESP32 -->
  <g transform="translate(350, 160)">
    <rect x="0" y="0" width="100" height="70" rx="8" class="esp32"/>
    <rect x="10" y="10" width="80" height="50" rx="4" fill="#2d3436"/>
    <!-- Pins -->
    <rect x="15" y="-5" width="6" height="5" fill="#b2bec3"/>
    <rect x="35" y="-5" width="6" height="5" fill="#b2bec3"/>
    <rect x="55" y="-5" width="6" height="5" fill="#b2bec3"/>
    <rect x="75" y="-5" width="6" height="5" fill="#b2bec3"/>
    <rect x="15" y="70" width="6" height="5" fill="#b2bec3"/>
    <rect x="35" y="70" width="6" height="5" fill="#b2bec3"/>
    <rect x="55" y="70" width="6" height="5" fill="#b2bec3"/>
    <rect x="75" y="70" width="6" height="5" fill="#b2bec3"/>
    
    <circle cx="20" cy="20" r="4" class="led"/>
    <text x="50" y="95" text-anchor="middle" class="text-title">ESP32 Typist</text>
    <text x="50" y="115" text-anchor="middle" class="text-light" fill="#fdcb6e" font-size="12">Biometric Engine</text>
  </g>

  <!-- Bluetooth Signals (from ESP32 to Target) -->
  <g transform="translate(500, 195)">
    <path d="M 0,0 Q 15,-15 30,0" class="bt b1"/>
    <path d="M -10,-10 Q 15,-35 40,-10" class="bt b2"/>
    <path d="M -20,-20 Q 15,-55 50,-20" class="bt b3"/>
    <text x="15" y="-60" text-anchor="middle" class="text-light" fill="#0984e3">BLE Keyboard</text>
  </g>

  <!-- Target Laptop -->
  <g transform="translate(590, 150)">
    <rect x="0" y="0" width="160" height="100" rx="5" class="laptop"/>
    <rect x="5" y="5" width="150" height="90" class="screen"/>
    <rect x="-10" y="100" width="180" height="10" rx="3" fill="#636e72"/>
    <text x="80" y="-15" text-anchor="middle" class="text-title">Target Laptop</text>
    
    <!-- Code typing animation -->
    <text x="15" y="30" class="text-light type1" fill="#55efc4">#include &lt;BLE.h&gt;</text>
    <text x="15" y="50" class="text-light type2" fill="#55efc4">void setup() {</text>
    <text x="25" y="70" class="text-light type3" fill="#55efc4">ble.begin();</text>
    <text x="15" y="90" class="text-light type4" fill="#55efc4">}</text>
  </g>
</svg>
